<?xml version="1.0" encoding="UTF-8"?>
<!-- SDR for Linux: AGC symbolic icon — rising signal bars held under one
     ceiling line (the levelled output). Single-colour, GTK recolours it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect fill="#2e3436" x="1"    y="10" width="3.5" height="5"/>
  <rect fill="#2e3436" x="6.25" y="7"  width="3.5" height="8"/>
  <rect fill="#2e3436" x="11.5" y="4"  width="3.5" height="11"/>
  <rect fill="#2e3436" x="0.5"  y="1"  width="15"  height="1.5"/>
</svg>
